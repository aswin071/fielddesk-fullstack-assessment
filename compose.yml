name: fielddesk

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fielddesk}
      POSTGRES_USER: ${POSTGRES_USER:-fielddesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fielddesk-development-only}
    ports:
      - "${POSTGRES_EXPOSE_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fielddesk} -d ${POSTGRES_DB:-fielddesk}"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_EXPOSE_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 15s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    command: ["./scripts/start-api.sh"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
      - path: .env
        required: false
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--uid=nobody", "--gid=nogroup"]
    volumes:
      - ./backend:/app/backend
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_REALTIME_URL: ${VITE_REALTIME_URL:-http://localhost:8000/api/v1/realtime/events}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  postgres_data:
  media_data:
  frontend_node_modules:
